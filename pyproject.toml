[project]
name = "agent-repl"
version = "0.1.0"
description = "Python REPL for AI agents with built-in tools and MCP integration"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Agent REPL Contributors"}]
keywords = ["ai", "agent", "repl", "python", "mcp", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
mcp-server = ["mcp[cli]>=1.2.0"]
dev = ["pytest>=7.0.0", "pyright>=1.1.0"]

[project.scripts]
repl = "agent_repl.cli:main"
agent-repl = "agent_repl.cli:main"
agent-repl-mcp = "agent_repl.mcp_server:main"

[project.urls]
Homepage = "https://github.com/eran-broder/agent-repl"
Repository = "https://github.com/eran-broder/agent-repl"
Issues = "https://github.com/eran-broder/agent-repl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_repl"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
